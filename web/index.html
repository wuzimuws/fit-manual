<div class="sub"><b>免责声明</b>　<strong>这本指南完全是我个人的经验</strong>，是我根据自己的情况总结出来、供大家参考的内容。<strong>具体真假、可信程度，请大家自行甄别。</strong>　它不能替代教练、医生和康复师。它是一份「我该知道什么」的清单，不是「有人陪你练」的服务。　<strong>资料来源</strong>：我读过的书 + 看过的抖音视频，<strong>不是学术文献</strong>。所以每条的「主观证据等级」和「来源」都由我自己标——把二手转述和一手验证分开。</div>

<script>
const DATA=[{"no": 1, "name": "心态", "intro": "<p>这一节放在最前面，因为它决定后面 7 节你能不能读得下去。</p><p>我不谈天赋，也不谈毅力。我只想回答一个问题：你现在这个身体，接下来几周到底该做什么。</p><h4>主题一 · 为什么开始</h4>", "items": [{"no": 1, "title": "只为了健康去健身，能坚持下来吗？", "sec": "心态", "总结性建议": "拿「健康」当唯一理由的人，大多会停下来。真正撑得住的是另外两条——想好看，和想取悦自己。", "具体地": "<p>把自己的理由写下来，凡是「应该」开头的都划掉，只留「我想要」开头的。如果留下的不到两条，先别办卡。练了三个月以后，如果「想好看」这条已经不给力了，就把「取悦自己」顶上来——它不是备胎，它是最耐用的那条。</p>", "为什么这样建议": "动机也靠反馈活着。体检报告、体脂秤这类指标半年才动一次，它不动的时候你就没东西可依；而镜子、照片、腰围是每周都在给你反馈的，所以撑得住。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 2, "title": "体重没掉，是不是白练了？", "sec": "心态", "总结性建议": "第一年里，腰围比体重更能说明问题。体重里有水分，腰围没有。", "具体地": "<p>每周固定一次，早上、空腹、排便后，用皮尺绕肚脐水平量一圈，记进训记。三个月腰围降 3–5cm 就是很明显的进展，这期间体重可能一点都没动。别每天称体重，一天之内差 1–2kg 是常事，那全是水。</p>", "为什么这样建议": "内脏脂肪比皮下脂肪先堆起来，也先掉下去，所以看腰围看到的是真东西。而体重很容易被碳水和盐带来的水分盖住——昨天吃咸了，今天秤上就多两斤，但那跟胖瘦没关系（控盐见 04 节）。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 3, "title": "管不住嘴怎么办？", "sec": "心态", "总结性建议": "大部分所谓的暴饮暴食，不是管不住嘴，是白天吃得太少，晚上一次性还回来。骂自己没用，把吃饭时间改了才有用。", "具体地": "<p>先把三餐固定下来，最要紧的是早餐和午饭别省。每餐先吃蛋白（鸡蛋、肉、豆制品），再吃主食。三餐都规律了还是压不住，就回头看是不是整体吃得太少。</p>", "为什么这样建议": "缺口太大的时候，身体会反过来逼你吃东西，这个不是靠意志力能压住的。饿到极点的那一顿一定会吃过量，这是生理反应——它跟自律没关系，跟你怎么安排一天有关！", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 4, "title": "健身能让皮肤变好吗？", "sec": "心态", "总结性建议": "别把皮肤算成健身的收益。算进去了，你会拿它去判断进展，然后判断错。", "具体地": "<p>把皮肤从训练收益的清单里划掉。真想让它变好，去管睡眠和洗脸，这两件比训练管用，也省时间。出汗不排毒，汗就是水和盐，别买「健身排毒」这一类东西。</p>", "为什么这样建议": "练完皮肤看着好，多半是顺带的——出了汗洗了脸、晚上睡得沉一点、压力小一点。它是训练的附带结果，不是训练的功劳，所以拿它当指标不准。", "主观证据等级": "C", "来源": "〔待你补〕", "level": "C", "src_done": false}, {"no": 5, "title": "练给谁看？", "sec": "心态", "总结性建议": "把评价权拿回来。练完那一下你自己舒不舒服，就是唯一有效的评判。", "具体地": "<p>别跟人比重量，也别把训练成果当作品发出去。哪天发现自己是为了发出去才去练的，那天就停一下问自己：不给我点赞，我还去不去？</p>", "为什么这样建议": "健身房里绝大部分人不会看你，剩下看你两眼的也在想自己的事。练一年下来你会发现，你身上唯一稳定可靠的观众是你自己。靠外面反馈撑起来的动机，会跟着那个反馈一起消失，而你总有不发东西的时候。", "主观证据等级": "C", "来源": "〔待你补〕  ---  ## 主题二 · 不怕中断", "level": "C", "src_done": false}, {"no": 6, "title": "中断了，还能继续吗？", "sec": "心态", "总结性建议": "任何好习惯的养成都不怕中断。断开不叫失败，真正让人停下来的是断了之后开始跟过去算账。", "具体地": "<p>断了之后第一件事不是补上，是把过去清零——今天去练一次，这一周就算练过一次。别去翻记录数自己这个月少练了几次，那个数字除了让你更不敢去，没有别的用。如果每次断练都要拖过一周才回得来，要看的是计划是不是排得太满。</p>", "为什么这样建议": "愧疚这个情绪会把人锁在过去，越想越觉得自己已经失败了。而「补回来」是拿超额惩罚自己一次，罚完更不想练。计划排得越满，断一次越不敢回来——这是计划设计的问题，不是意志力的问题。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 7, "title": "漏练了要不要补回来？", "sec": "心态", "总结性建议": "漏了就漏了，下一次按原计划练就行。", "具体地": "<p>把「补练」这个概念整个删掉，计划里只有「下一次练什么」，没有「欠了多少」。别一天练两个部位凑数，也别靠延长单次训练时间来找补。</p>", "为什么这样建议": "补练等于拿超额惩罚自己，练到差点吐之后通常接着歇一整周，比不补还糟。那份力气留着，用在「下一次准时到」上更划算！", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 8, "title": "断了两周，第一次怎么回来？", "sec": "心态", "总结性建议": "断两周力量掉不了多少，掉的是体感——同样的重量你会觉得重得多。所以第一次回来一定要主动降。", "具体地": "<p>第一次回来，重量降到断之前的 70–80%，组数减一组，能做完就算成功。第二次按正常计划练，第三次再试着追回原来的重量。第一次练完第二天酸到影响生活，说明降得还不够，下次再低一档。</p>", "为什么这样建议": "两周停训对新手的力量损失很小，但神经和肌肉的「感觉」会钝掉，这是两回事。拿断之前的记录当第一天的标准去挑战，你会在复训第一天就被打击，然后就不想再来。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 9, "title": "今天是该休息，还是在逃避？", "sec": "心态", "总结性建议": "这两样很好分。真累的人会想「什么时候能练」，在逃避的人会想「今天有什么理由不练」。", "具体地": "<p>给自己定一条硬规则——只要不是发烧、不是吐、不是医生说不，就去，哪怕只练 15 分钟。连着两周都用「状态不好」跳过，那就不是状态问题，是计划或者动机的问题。</p>", "为什么这样建议": "去了就没断链，而断链才是习惯死掉的真实原因。「等状态好了再练」基本就是无限期推迟的一种说法。", "主观证据等级": "C", "来源": "〔待你补〕  ---  ## 主题三 · 在健身房里", "level": "C", "src_done": false}, {"no": 10, "title": "给大佬买水求教，有用吗？", "sec": "心态", "总结性建议": "这条被很多人当成攻略传，但把它当成普适建议，我不太建议。", "具体地": "<p>两种情形分开看——如果对方主动乐意教你，那当然没问题；但如果你要靠买水、搭话去换取指导，就先想想下面两件事。</p>", "为什么这样建议": "第一，不是每个人都是外向型的人，你自己可能是，那位你也想请教的人可能不是，硬要开口对双方都是负担。第二，去健身房的人目的都很明确，就是要在一个比较短的时间里把今天的训练做完，所以他的时间对他自己也是非常宝贵的，不一定给了你。", "主观证据等级": "C", "来源": "〔待你补〕", "level": "C", "src_done": false}, {"no": 11, "title": "别人盯着我看，怎么办？", "sec": "心态", "总结性建议": "完全不需要在意别人的看法。大家都是来健身的，没有谁比谁高人一等，都是从新手过来的。放平心态，大胆去练，注意力放在自己的动作上。", "具体地": "<p>如果被人盯着看会紧张，就给自己一个具体的动作替代——把注意力收到「这一次的轨迹对不对、速度稳不稳」上面。眼睛盯着自己的目标肌肉和器械，不看人。练两周你就会发现，绝大部分人根本不看你。</p>", "为什么这样建议": "紧张来自「我在被评价」这个假设，但这个假设基本不成立——别人在数自己的次数。而怕出丑的结果是你不敢试新动作、不敢加重，练一年还在原地。丢掉这个假设，是新手最便宜的一次进步。", "主观证据等级": "C", "来源": "〔待你补〕  ---  ## 主题四 · 练到最后", "level": "C", "src_done": false}, {"no": 12, "title": "练一年，你会拿到什么？", "sec": "心态", "总结性建议": "健身是一个修炼的过程，也是一个修心的过程。练到最后，你拿到的比肌肉多——更平静，生活更有规律，更健康，遇事更沉着冷静，心态更平和。", "具体地": "<p>这几个变化不是哪一次训练给你的，是靠「每周三次、练一年」这件事本身磨出来的。判断它有没有发生，看这几个信号就够：遇事不容易烦了、睡觉和吃饭变得有规律、别人说的话没那么容易进到心里去。</p>", "为什么这样建议": "训练是少数几件投入和产出对得上的事。你练什么、吃多少、睡几个小时，身体都会如实反馈，没有捷径，也没有例外。长期在一件这样的事上反复拿到结果，人会慢慢变得有耐心、沉稳、平和。这不是玄学，是规律生活带出来的副产品。", "主观证据等级": "C", "来源": "〔待你补〕", "level": "C", "src_done": false}, {"no": 13, "title": "网上的说法，该信哪个？", "sec": "心态", "总结性建议": "健身相关的知识纷繁复杂、鱼目混珠。一定要学会带着质疑的眼光去看各种知识，<strong>不要求全</strong>，本着实事求是的精神去健身。", "具体地": "<p>看到一条说法，先问三个问题——① 说这话的人自己练成什么样了 ② 他有没有讲清楚「什么情况下不适用」 ③ 我自己能不能用一两周验证它。三个都答不上来的，先放一边。</p>", "为什么这样建议": "这个领域没有准入门槛，谁都能说两句。而「求全」会让你把互相矛盾的说法全收进来，最后一样都做不了。实事求是的意思是：能验证的就验证，验证不了的就先不用。", "主观证据等级": "A", "来源": "〔待你补〕", "level": "A", "src_done": false}, {"no": 14, "title": "练出问题了，是坏事吗？", "sec": "心态", "总结性建议": "对新手来说，发现问题应当是一件好事，是一个令人兴奋的过程，应该保持开心、高兴的心态。", "具体地": "<p>发现问题之后，用科学的态度对待它——<strong>不去过度锻炼、不去过度训练、不去冲大重量、不满足自己的虚荣心</strong>。踏实、实事求是，就保持这样一个心态。然后把问题描述清楚（方法见 07 节第 7 条），针对性地去解决，一步一步把自己完善起来。</p>", "为什么这样建议": "新手没有成体系的经验，只能通过实践去踩坑、去触发一些常见错误，<strong>让这些问题通过一些小伤小痛爆发出来</strong>。所以发现问题、发现疼痛和伤痛，这不是什么问题——它是你唯一能拿到反馈的渠道。<strong>真正出事的不是「遇到问题」，是遇到问题之后用虚荣心去处理它</strong>：硬扛、加重量、证明自己没事。而实践是检验真理的唯一标准，别人说的、书上写的，只有你自己练过才算数，练出来的问题才是真问题。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 15, "title": "该把身体当成什么？", "sec": "心态", "总结性建议": "保持沉稳的心态，把身体当成自己的合作伙伴。善待它、充分地利用它、爱护它、保护它。", "具体地": "<p>落到操作上就是——不给它扛不住的重量（03 节），不给它太小的缺口（04 节），不欠它的睡眠（06 节），疼了就去查、不硬撑（07 节）。</p>", "为什么这样建议": "把它当对手，你会去压榨它，结果是受伤和放弃；把它当合作伙伴，你会去问它今天状态怎么样。你能练多久，取决于这段关系有多稳。", "主观证据等级": "C", "来源": "〔待你补〕  ---  &gt; <strong>下一节：2. 关键节点</strong> —— 肩胛·髋·足·解剖软件", "level": "C", "src_done": false}]}, {"no": 2, "name": "关键节点", "intro": "<p>这一节讲的是最容易被新手跳过的几个地方：<strong>肩胛、髋、足</strong>，还有一样工具——解剖软件。</p><p>它们不是「先做完才能开始练」的前置作业，你可以边练边补。但它们是关键节点：<strong>上肢看肩胛，下肢看髋</strong>，而足是唯一接触地面的地方。这三个地方动不好，你练什么都是代偿——动作看着在做，力没走对路。</p><p>所以值得单独拎出来，排在其他内容前面说。</p>", "items": [{"no": 1, "title": "怎么知道自己练的是哪块肌肉？", "sec": "关键节点", "总结性建议": "新手期最该花的一小时不是练，是打开一个解剖软件，把要练的那几块肌肉的起止点、运动轨迹看一遍。不要钱，一次就够。", "具体地": "<p>先只看三样——① 这块肌肉从哪连到哪 ② 它收缩时把骨头往哪个方向拉 ③ 你做的动作里它在什么位置。先看这五块：背阔肌、胸大肌、三角肌、臀大肌、股四头肌。之后每次遇到一个动作说不清哪块肌肉在动，回去查一次就够了。</p>", "为什么这样建议": "认不出位置，教练说「收肩胛」你都不知道肩胛在哪，所有纠正都落不到实处。查的次数会一次比一次少，但一开始这一小时省不掉。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 2, "title": "练之前，该先补哪里？", "sec": "关键节点", "总结性建议": "全身动作看着很多，但卡住的地方只有两个——上肢看肩胛，下肢看髋。这两处动不好，练什么都是代偿。", "具体地": "<p>把这两块单独拎出来，一周各花 10 分钟，别混在训练里，练之前单独做。能主动做出肩胛的上回旋和下回旋、也能主动做出屈髋，再回去练正式动作。</p>", "为什么这样建议": "动作做不出来的时候去加重量，只是把代偿固化得更深。先把控制力建起来，后面所有的重量才建在正的地方。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 3, "title": "背没感觉，是哪里没练到？", "sec": "关键节点", "总结性建议": "肩胛骨不是一块钉死的板，它是被好几块肌肉拉着的一块活动骨。它稳不住，你练的是胳膊不是背。", "具体地": "<p>针对性练四块——大小圆肌、前锯肌、冈上肌、冈下肌。前锯肌管肩胛向前和上回旋（俯卧撑加、靠墙滑），冈上肌和冈下肌是肩袖（外旋、稳定），大小圆肌管肩胛内收。一次 10 分钟。</p>", "为什么这样建议": "高位下拉做到一半就耸肩，是因为肩胛锁不住，胳膊在替背干活。练这四块，才能把「先沉肩、再下拉」变成你主动能做出来的动作。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 4, "title": "蹲不下去、一蹲腰就塌，是腿不行吗？", "sec": "关键节点", "总结性建议": "久坐的人髋是前面紧、后面弱。三件事都得做——髂腰肌又放松又练、臀大肌强化、梨状肌放松，缺一件都是半截。", "具体地": "<p>① 髂腰肌：先放松拉伸（弓步压髋），再在拉长的位置练它的控制，不是做屈髋把它缩得更短 ② 臀大肌：强化（臀桥、髋外展、髋伸类）③ 梨状肌：放松（泡沫轴、鸽子式）。一次 15 分钟。</p>", "为什么这样建议": "久坐的人髂腰肌长期处在缩短位，所以紧；但那个长度下它几乎不发力，所以也弱。紧和弱是同时存在的，不是二选一！只放松不练，松完就缩回去；只练不放松，在缩短位强化会越练越紧。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 5, "title": "屈髋到底该怎么屈？", "sec": "关键节点", "总结性建议": "屈髋是上半身往前折的同时屁股向后坐——动的是髋，不是腰。", "具体地": "<p>手放在髋骨和肋骨之间那段腰上，做「屁股往后顶」的动作。手放的位置不应该有拉伸感，有就是弯腰了。能连着做 10 次而腰不酸，就算会了。</p>", "为什么这样建议": "弯腰是腰在动，屈髋是髋在动，这两个手感完全不同。分不清的人，会把所有俯身动作都做成弯腰，然后拿腰去还债。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 6, "title": "抬手臂会卡、会痛，怎么办？", "sec": "关键节点", "总结性建议": "肩峰撞击不是得了什么病，多数情况靠改动作和练肩袖就能避开。", "具体地": "<p>① 推举时让肩胛跟着往上转，别把肩胛锁死 ② 侧平举别抬过肩高 ③ 练肩外旋（冈下肌）。抬手臂有「卡一下」的感觉，或者肩前方疼，先回去查动作轨迹，别硬练。</p>", "为什么这样建议": "手臂抬到某个角度时，肱骨和肩峰之间的空隙变窄，夹到里面的肌腱。这个空隙是被你的姿势和肩袖力量决定的，所以能改。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 7, "title": "深蹲膝盖内扣，是膝盖的问题吗？", "sec": "关键节点", "总结性建议": "脚是唯一接触地面的地方。足弓塌下去，力量从脚就开始漏——膝盖内扣、髋不稳，一路传到腰。", "具体地": "<p>① 练拇趾外展肌和足内在肌（脚趾抓毛巾、短足训练）② 练单腿站 ③ 赤脚做几分钟足部激活再穿鞋练。单腿站时足弓不塌、大脚趾不歪着压地，脚上就有支撑了。</p>", "为什么这样建议": "膝盖内扣是背锅的，源头常常在脚。另外要分清：训练能改善踇外翻带来的发力不稳和疼痛，但改不了已经长成的骨头，别指望练一练骨性角度能回去。", "主观证据等级": "B", "来源": "〔待你补〕  ---  &gt; <strong>下一节：3. 训练</strong> —— 热身 / 循环 / 8-15 次 / 怎么加重", "level": "B", "src_done": false}]}, {"no": 3, "name": "训练", "intro": "<p>这一节按你实际会撞上的顺序排：先热身，再选怎么练，再是前两个月该盯什么，最后是怎么加重。</p><p>有一件事得记住——这一节分三段走，别跳级：</p><table><thead><tr><th>阶段</th><th>盯什么</th><th>看第几条</th></tr></thead><tbody><tr><td>前 1–2 个月</td><td>动作正确 + 不受伤，不追发力感</td><td>7、8</td></tr><tr><td>大约 3–6 个月</td><td>建立发力感（背尤其慢）</td><td>9</td></tr><tr><td>能感受到发力感之后</td><td>才加张力控制：起手叫醒肌肉、全程不松</td><td>10</td></tr></tbody></table>", "items": [{"no": 1, "title": "热身要做多久，做到什么程度？", "sec": "训练", "总结性建议": "热身不是走过场。5–10 分钟，专门活动开今天要练的那几个关节和肌肉，再上重量。", "具体地": "<p>今天练背就活动肩胛和肩，练腿就活动髋、膝、踝。分两步——① 3–5 分钟让心率上来（快走、慢骑、空杆）② 3–5 分钟针对当天的关节做动态活动，再做 1–2 组轻重量找感觉。<strong>另外，泡沫轴只滚肌肉，别滚肋骨、腰和关节。</strong></p>", "为什么这样建议": "我 3 月的一次热身，用泡沫轴滚压肋骨，没滚到胸大肌的位置，把肋骨滚到骨裂，停训了一个月——泡沫轴压在肋骨、髋骨这些没有肌肉垫着的骨头上，压力是直接进骨头的。另外，冷着的肌肉和关节弹性差，神经募集也差。第一组直接上重量，动作发僵、关节发涩，等于拿一整节课去热身。轻重量是热身组、不是热身，前面那 5–10 分钟不算组数。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 2, "title": "第一组该上多大重量？", "sec": "训练", "总结性建议": "热身之后还要有一组轻的。这组的作用是让神经把动作路线走一遍，不是练。", "具体地": "<p>用正式重量的 50–60% 做一组 8–10 次，动作完全走顺了再上正式重量。这一组不计入工作组。做完还是别扭，就再来一组，不要硬上。</p>", "为什么这样建议": "急着开始会让第一组动作变形，后面两组全在还债。而把轻的那组算进「今天做了几组」，实际工作量就悄悄缩水了。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 3, "title": "一周该怎么排？", "sec": "训练", "总结性建议": "训练循环就那几种，新手要的是每块肌肉一周练到 2 次，不是把某一块一次练废。", "具体地": "<p>① 上下肢二分化（最简单）：周一上肢、周二下肢、周三休，循环 ② 推拉蹲：推（胸肩三头）、拉（背二头）、蹲（腿）各一天，中间排休息 ③ 练二休一：练两天休一天，不管分化，节奏优先。一个循环至少跑三周再判断。</p>", "为什么这样建议": "新手恢复快、合成窗口短，靠频率拿产量比靠单次练废划算得多。而且固定循环之后，你一周练什么就不用每天重新想。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 4, "title": "五分化能直接用吗？", "sec": "训练", "总结性建议": "五分化是每块肌肉一周只练 1 次，频率明显偏低，这套更适合已经练了一年的人。", "具体地": "<p>新手期先用推拉蹲或上下肢二分化，把每块肌肉的频率做到每周 2 次。等练满一年、单次训练时间明显不够用了，再考虑拆成五分化。</p>", "为什么这样建议": "排得整齐不等于安排合理。五分化好看，但短板就在频率——同样一周时间，你的每块肌肉只被刺激一次。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 5, "title": "该练器械，还是自由重量？", "sec": "训练", "总结性建议": "新手用<strong>器械</strong>来稳定地刺激肌肉，再用<strong>自由训练</strong>去激活器械练不到的小肌群，把整体稳定性补起来。两个都要，但不是五五分。", "具体地": "<p>主体放器械——固定轨迹让你在动作还不会的时候就能把重量加上去，稳定地给到目标肌肉。自由训练放在后面，用小重量练器械覆盖不到的地方：<strong>肩袖、肩胛稳定肌、核心、单侧稳定</strong>。一节课 1–2 个自由动作就够，不用多。</p>", "为什么这样建议": "器械的好处是轨迹固定，你不用先学会控制，就能把刺激准确送到目标肌肉上，这对新手最省事。但它的短板也很明确——轨迹固定就意味着有些肌肉它用不上。你在大器械上推胸，肩袖和肩胛周围那些小肌肉基本没参与，而它们恰恰是让你后面所有动作稳得住的东西。这部分只能靠自由训练补，练到后面你会发现，卡住你的不是大肌群的力量，是这些小地方的稳定。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 6, "title": "先练哪个部位？", "sec": "训练", "总结性建议": "一定要多练背。肩膀和胸不用太着急练。", "具体地": "<p>先把肩胛骨相关的肌肉练起来（02 节第 3 条那四块：大小圆、前锯肌、冈上、冈下），能主动控制住肩胛骨之后，再加大练肩的量。练肩的时候让肩胛跟着往上转，别把它锁死。</p>", "为什么这样建议": "肩胛骨是肩关节活动的地基。地基没建好的时候去练肩，重量都压在肩关节本身上，效率低，而且容易伤。我自己左侧肩袖活动度差就是瞎练练出来的——<strong>那个肩痛困扰了我差不多 10 年</strong>，后来是自己一点点加强肩袖肌群才慢慢恢复的。先建地基，见效慢一点，但你不会走回头路。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 7, "title": "练了没感觉，是不是白练？", "sec": "训练", "总结性建议": "新手前两个月不要太追求肌肉的发力感。这不是你的问题，是还没建立起来。", "具体地": "<p>把注意力从「有没有感觉」挪到「动作对不对」上——轨迹对不对、速度是否可控、有没有借力。动作稳了以后再进入第 9 条。</p>", "为什么这样建议": "肌肉的神经募集能力天生不一样。手臂、胸的发力感好找，背几乎找不到，肩胛骨的控制能力也很差。硬找感觉的结果就是甩、是借力、是改轨迹，而找感觉的动作，通常就是错的动作。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 8, "title": "前两个月该盯什么？", "sec": "训练", "总结性建议": "前两个月只有两个标准——动作做对、没人受伤。重量涨不涨、有没有感觉、别人练多少，这两个月都不重要。", "具体地": "<p>每次训练问两句话：今天哪个动作做歪了？有没有哪里疼？答案写进训记。动作能连续几周稳定复制，才算进入下一阶段。</p>", "为什么这样建议": "这两个月加重量，大概率是拿动作换的。别拿「今天重量加了」当进步的证据，你只是把错的动作练得更熟了。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 9, "title": "背什么时候才有感觉？", "sec": "训练", "总结性建议": "背的发力感不是练出来的，是等出来的。通常要三到六个月，有的人更久。", "具体地": "<p>这期间别停、别换动作、别加重量，继续用正确的轨迹练，把「没感觉」当成正常进度。哪天你突然发现「这一下拉到背上了」，那一刻就是进入第 10 条的信号。</p>", "为什么这样建议": "神经和肌肉的连接需要时间建，这期间肌肉一直在长，只是你感觉不到。而每换一次动作，重建连接的进度就归零。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 10, "title": "什么时候开始讲究张力？", "sec": "训练", "总结性建议": "（在你能感受到目标肌肉发力之后再做这一步；动作还没稳、还找不到感觉的，先回第 7、9 条）开始动作时先让目标肌肉发上力，整组过程中不让它松掉。", "具体地": "<p>① 起手前先有意收紧目标肌肉一下，再开始动作 ② 回程别放到底就卸力，回程才是长肌肉的那一段 ③ 全程慢下来，尤其在还原的半程。保持张力之后动作开始晃，说明重量还太大，降重量。</p>", "为什么这样建议": "同一个重量，做到和没做到差很多。但要是在一个你还找不到发力的轨迹上保持张力，那等于把代偿练得更扎实——所以这一步必须排在第 7、9 条之后。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 11, "title": "一组做几次？", "sec": "训练", "总结性建议": "新手每组做 8–15 次就够了，别去冲只能做 3–5 次的大重量。", "具体地": "<p>选一个能做完 8–15 次、最后两三次明显费劲但还能控制的重量。做不满 8 次就是太重，能做 15 次还轻松就是太轻。新手阶段不需要测 1RM。</p>", "为什么这样建议": "次数少到 3–5 次那个程度，练的就不是动作，是「能不能把它举起来」。而这个阶段你还没有能力在极限重量下保持动作，练的正好是你要避开的东西。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 12, "title": "该不该冲重量？", "sec": "训练", "总结性建议": "保证安全、不受伤，优先级在进步之上。练一年不受伤，比练一年进步快重要得多。", "具体地": "<p>把「不受伤」当成一条硬指标，跟重量次数一样记。每次训练结束问一遍：今天有没有哪里不舒服？出现尖锐疼痛、关节响痛、麻，立刻停那个动作换别的。</p>", "为什么这样建议": "伤一次，你所有的进度都要清零重来。而忍耐在健身房里没有任何回报——没人给你发忍耐奖。", "主观证据等级": "A", "来源": "〔待你补〕", "level": "A", "src_done": false}, {"no": 13, "title": "什么时候加重、加多少？", "sec": "训练", "总结性建议": "一次只改一个变量。先把次数做满，再加重量。", "具体地": "<p>当这个重量你能连续两次做到区间上限（15 次）且动作不变形，下一次加最小的一档重量，次数回到区间下限（8 次），然后一次次往上爬。加重量之后做不满 8 次或者动作变形，就回到原来的重量。</p>", "为什么这样建议": "顺序反了，你就永远在「加一点、做不动、降回来」里循环。而且同时改三样（重量、组数、频率），你根本不知道是哪一样起了作用。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 14, "title": "什么时候能练引体向上？", "sec": "训练", "总结性建议": "引体向上一次要三样东西同时到位——背阔肌力量、握力、肩胛骨稳定性。缺一样，你练的是「晃上去」，练不到背还伤肩。", "具体地": "<p>等训练步入正轨再开始试。在此之前先练分解动作：高位下拉（背阔）、悬垂静挂（握力）、肩胛下沉（稳定）。能不晃、不甩、肩胛先沉下去再拉，才叫会用引体向上练背。</p>", "为什么这样建议": "靠甩和弹把身体弄上去，上去的是身体不是背。而且三样里缺哪一样，负荷就压到肩膀上去——这是新手最常见的肩伤来源之一。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 15, "title": "请了教练，我该做什么？", "sec": "训练", "总结性建议": "找教练的目的是帮你熟悉器械、纠正新手的常见错误动作，不是让你全程依赖他、把自己的大脑关掉。", "具体地": "<p>教练带你的时候做四件事——① 动脑想这个动作的要点 ② 想它为什么这么做（原理）③ 记录自己的问题（今天哪次做错、教练怎么纠的）④ 课后搜短视频，对着看动作细节。</p>", "为什么这样建议": "要想快速进步，就得尽快脱离教练辅助。全程依赖等于花钱把自己的大脑外包出去，课上完你还是不会自己练。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 16, "title": "什么时候可以脱离教练？", "sec": "训练", "总结性建议": "判断标准只有一条——你能不能自己排一次训练、自己判断一遍动作对错。", "具体地": "<p>拿一周做测试：自己定循环、自己选动作、自己定重量、自己记。练完回头看有没有哪个动作说不清为什么这么做，说不清的下一次上课专门问那一个。这一周能独立走完、且没受伤，就停课。</p>", "为什么这样建议": "「练好」没有终点，能不能独立才有。用「还没练好」当续课理由，可以无限续下去。", "主观证据等级": "B", "来源": "〔待你补〕  ---  &gt; <strong>下一节：4. 饮食</strong> —— 吃够 / 吃得干净 / 喝大水", "level": "B", "src_done": false}]}, {"no": 4, "name": "饮食", "intro": "<p>这一节只有九个字：吃够、吃得干净、喝大水。</p><p>看着像废话，但我练这一年踩过的最大的坑就在这九个字里：训练量练得很大，吃却吃得很少。结果不是变瘦变壮，是代谢下去、睡眠变差、状态全面塌掉。</p>", "items": [{"no": 1, "title": "饮食到底该怎么吃？", "sec": "饮食", "总结性建议": "三件事里，吃够排第一，而且是新手最容易做反的那一件。", "具体地": "<p>先把「吃够」做到，再谈干不干净。顺序反了会出大问题——先追求「吃得干净」的人，十有八九吃成了不够，然后掉进第 2 条的坑。体重、睡眠、训练状态这三样里有两样连续两周变差，先回头查吃够没有。</p>", "为什么这样建议": "干净与否是质量，吃够与否是数量。数量不够的时候，质量再好也撑不住训练量，身体会按缺口的程度降消耗、压恢复。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 2, "title": "练得多、吃得少，会怎样？", "sec": "饮食", "总结性建议": "练得多加吃得少，不等于更快出结果，等于把自己练废。", "具体地": "<p>把缺口控制在每天 250–450 kcal，对应每周掉 0.2–0.5 kg。出现这三个信号里的两个，立刻把碳水加在训练日：① 睡眠变差 ② 白天没精神 ③ 训练重量连着两周往下掉。</p>", "为什么这样建议": "缺口太大的时候，身体会主动降消耗、压恢复。这个坑特别隐蔽，因为你练得越多，越觉得自己有资格少吃！", "主观证据等级": "A", "来源": "〔待你补〕", "level": "A", "src_done": false}, {"no": 3, "title": "要不要记录饮食？", "sec": "饮食", "总结性建议": "不记录，你永远不知道自己吃够没有。", "具体地": "<p>装一个记录饮食的 App——<strong>iOS 端用「记食本」，那是我为了记录饮食自己开发的</strong>（见前言）。把每天吃的所有东西记进去，包括饮料、零食、随手抓的那几口。</p>", "为什么这样建议": "人对自己的热量估算误差能到一倍。这不是自制力问题，是记忆和估重能力的问题——尤其漏掉的那部分，通常正好是让你超标的那些。我自己卡在瓶颈上很久，就是因为我以为「吃够了」，而实际上一直不够。", "主观证据等级": "A", "来源": "〔待你补〕", "level": "A", "src_done": false}, {"no": 4, "title": "训练日和休息日，该吃一样多吗？", "sec": "饮食", "总结性建议": "练的日子该多吃，不练的日子该少吃。", "具体地": "<p>蛋白和脂肪三天不动，只调碳水——训练日最多、有氧日中间、休息日最少。这样你只需要记一个变量。</p>", "为什么这样建议": "每天都吃一个数，会出现练腿那天饿得发慌、休息日又吃撑着。分开算之后，练的日子缺口只留一点点，缺口靠不练的日子拉，比每天都饿着容易坚持得多。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 5, "title": "具体该吃多少克？", "sec": "饮食", "总结性建议": "蛋白、脂肪、碳水的目标值按体重倍数算，不按感觉算。", "具体地": "<p>按 70kg 举例——</p><table><thead><tr><th>日型</th><th>蛋白</th><th>脂肪</th><th>碳水</th><th>热量</th></tr></thead><tbody><tr><td><strong>力量训练日</strong></td><td>140g（2.0×）</td><td>56g（0.8×）</td><td><strong>280g（4.0×）</strong></td><td>2184</td></tr><tr><td><strong>有氧日</strong></td><td>140g（2.0×）</td><td>56g（0.8×）</td><td><strong>230g（3.3×）</strong></td><td>1984</td></tr><tr><td><strong>休息日</strong></td><td>140g（2.0×）</td><td>56g（0.8×）</td><td><strong>200g（2.9×）</strong></td><td>1864</td></tr></tbody></table><p>换别的体重就乘倍数：蛋白 = 体重×2，脂肪 = 体重×0.8，碳水训练日 = 体重×4。连续两周体重和腰围都不动，先减休息日的碳水，别动训练日的。</p>", "为什么这样建议": "减脂期蛋白是保肌的锚，宁可削碳水；而且只动一个变量，新手才记得住。碳水的 4 倍是上限不是目标——设上限是留余量的，你实际最高只用到 4 倍。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 6, "title": "怎么判断自己吃够了？", "sec": "饮食", "总结性建议": "「吃够」不是吃饱的感觉，是四个指标一起看的结论。", "具体地": "<p>连续两周看这四样——① 训练重量能维持或缓慢上升 ② 睡眠正常 ③ 白天不困 ④ 每周掉重不超过 0.5 kg。四条都成立，就是吃够了。①②③ 里任意两条往下走，就加碳水。</p>", "为什么这样建议": "缺口大的时候人是会习惯饿的，饿不饿说明不了任何事。而训练表现、睡眠和精神不会被主观意愿骗过去。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 7, "title": "「吃得干净」到底指什么？", "sec": "饮食", "总结性建议": "「干净」不是水煮、不是无油、不是吃草。它指三件事：少油炸、少添加糖、少深加工。", "具体地": "<p>同一顿饭，把油炸换成煎烤、把含糖饮料换成水或茶、把包装零食换成能看出原来是什么的东西。热量下来了，味道没怎么变。</p>", "为什么这样建议": "把「干净」执行成水煮鸡胸加西兰花天天吃，你撑不过两周，而且大概率吃不够。另外，如果为了「干净」开始吃不下饭、开始怕食物，立刻停下回头——那已经不是饮食管理，是饮食障碍的前兆。", "主观证据等级": "C", "来源": "〔待你补〕", "level": "C", "src_done": false}, {"no": 8, "title": "一天该喝多少水？", "sec": "饮食", "总结性建议": "水是免费的那一半。喝够水，训练状态、恢复、甚至饿的感觉都会变好。", "具体地": "<p>按体重 × 40ml 算基础量——70kg 就是 2.8L；训练日再加 500ml–1L。分次喝，别一次灌。尿液颜色一直是深黄，说明没喝够。</p>", "为什么这样建议": "它一分钱不花，代价为零，收益却落在训练状态和恢复两处，是全书性价比最高的一条。别用饮料、奶茶、果汁代替水，那些是热量。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 9, "title": "记到什么时候可以不记？", "sec": "饮食", "总结性建议": "记录是工具不是义务。练到「看一眼就知道大概多少」，就可以停。", "具体地": "<p>记满 1–2 个月后改成每周抽查记 2–3 天。换工作、出差、饮食环境大变的时候，恢复连续记录一周。</p>", "为什么这样建议": "一直记下去的成本会慢慢超过收益，但完全凭感觉又会飘回去。抽查是在两者之间取平衡——记不记都要吃够，记录只是帮你看见。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 10, "title": "盐该吃多少？", "sec": "饮食", "总结性建议": "每天食盐不超过 5g（约等于钠 2000mg）。中国大部分人一天吃 10g 以上，是推荐值的两倍。", "具体地": "<p>5g 是什么概念——一啤酒瓶盖平铺差不多就是 5g。① 家里换一个 2g 的量勺，做菜按勺放 ② 一天总量分成三顿用，别全压在一顿 ③ 汤和菜汁少喝，盐大部分沉在汤里。</p>", "为什么这样建议": "钠摄入过多会导致血压升高和储水。储水这一项最直接，它会骗你的体重秤（见第 2 条）。控盐等于让体重这个指标重新可信。", "主观证据等级": "A", "来源": "〔待你补〕", "level": "A", "src_done": false}, {"no": 11, "title": "明明没吃咸，为什么还会钠超标？", "sec": "饮食", "总结性建议": "钠不只藏在盐罐里。你控的是「食盐」，身体算的是「钠」。", "具体地": "<p>记住换算——1g 食盐约等于 400mg 钠。</p><table><thead><tr><th>常见来源</th><th>折合盐</th></tr></thead><tbody><tr><td>1 汤匙（15ml）生抽</td><td>约 2.3g</td></tr><tr><td>1 包方便面</td><td>3–5g</td></tr><tr><td>1 根火腿肠</td><td>约 1g</td></tr><tr><td>一顿外卖</td><td>常超全天额度</td></tr></tbody></table><p>用酱油、蚝油、豆瓣酱的时候，就从 5g 额度里扣掉。</p>", "为什么这样建议": "做菜时盐放得很少、但生抽蚝油鸡精一样没停，加起来比直接放盐还多。别用「我没放盐」当控盐成功的证据——你可能放了三种酱！", "主观证据等级": "A", "来源": "〔待你补〕", "level": "A", "src_done": false}, {"no": 12, "title": "外卖能不能吃？", "sec": "饮食", "总结性建议": "外卖是控盐最大的敌人，它的咸度是按「好吃」设计的，不是按你的血压设计的。", "具体地": "<p>① 能自己做就自己做 ② 点外卖时要求少盐少油、酱汁另放 ③ 买东西翻背面看营养成分表，只看一个数：「钠」那一行的毫克数，乘 2.5 折成盐。</p>", "为什么这样建议": "一顿外卖的钠经常是全天额度的两倍以上，而且你完全看不见他放了多少。看标签是唯一能自己掌握的手段。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 13, "title": "主食该怎么选？", "sec": "饮食", "总结性建议": "主食换掉一部分，把白米白面换成需要嚼的粗粮；零食换成能看出原来是什么的东西。", "具体地": "<p>① 主食里至少一半换成粗粮——糙米、钢切燕麦、红薯、土豆 ② 买包装食品先看配料表，配料表越长、越看不懂的越不吃 ③ 不用戒掉白米饭，只是别让它占满整碗。</p>", "为什么这样建议": "精加工把纤维、维生素和「需要嚼」这几样都拿掉了，剩下的主要是热量和吸收快的碳水。饱腹感差，你自然就会吃得更多，光靠少吃是很难补回来的。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 14, "title": "具体该吃哪些东西？", "sec": "饮食", "总结性建议": "与其记规则，不如照着买——下面这份清单可以直接当采购单用。", "具体地": "<table><thead><tr><th>类别</th><th>吃什么</th></tr></thead><tbody><tr><td><strong>主食</strong></td><td>红薯、土豆（<strong>蒸熟放凉</strong>）、钢切燕麦、糙米</td></tr><tr><td><strong>蛋白质</strong></td><td>鸡蛋、鱼肉、白肉（鸡鸭肉，去皮）、红肉（牛羊猪肉）</td></tr><tr><td><strong>脂肪</strong></td><td>南瓜籽仁、混合坚果、橄榄油</td></tr><tr><td><strong>膳食纤维</strong></td><td>奇亚籽、羽衣甘蓝</td></tr><tr><td><strong>蔬菜</strong></td><td>西兰花、洋葱、紫甘蓝、绿甘蓝</td></tr></tbody></table>", "为什么这样建议": "靠规则吃饭太累，靠清单吃饭简单。另外注意土豆那一条——<strong>蒸熟放凉之后淀粉会转成抗性淀粉</strong>，血糖上升更平缓，也更容易被肠道菌群利用。同一个土豆，热吃和凉吃不一样。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 15, "title": "膳食纤维怎么吃够？", "sec": "饮食", "总结性建议": "膳食纤维要吃够（每天 25–30g），但<strong>别指望绿叶菜</strong>——它们大多只有 1–2g/100g。", "具体地": "<p>真正的纤维大户是这几类——</p><table><thead><tr><th>类别</th><th>举例</th><th>纤维（每 100g）</th></tr></thead><tbody><tr><td><strong>种子</strong></td><td>奇亚籽、亚麻籽、洋车前子壳</td><td><strong>27–34g</strong></td></tr><tr><td><strong>豆类</strong></td><td>黄豆、黑豆</td><td><strong>约 15g</strong></td></tr><tr><td><strong>全谷物</strong></td><td>钢切燕麦、糙米</td><td>10g / 3.5g</td></tr><tr><td><strong>坚果</strong></td><td>杏仁、南瓜籽仁</td><td>约 12g</td></tr><tr><td><strong>对比：绿叶菜</strong></td><td>菠菜、生菜、白菜</td><td><strong>只有 1–2g</strong></td></tr><tr><td>羽衣甘蓝</td><td>（你清单里那个）</td><td>约 3.6g，已经算绿叶菜里高的</td></tr></tbody></table><p>最简单的吃法：早上燕麦里加一勺奇亚籽，或者午晚各一份豆类。</p>", "为什么这样建议": "纤维的作用分两头——<strong>可溶性纤维</strong>（燕麦、奇亚籽、果胶）延缓血糖上升、结合胆汁酸降血脂、还能喂肠道菌群；<strong>不可溶性纤维</strong>（糙米、麦麸）增加粪便体积、促进排便。两头都有用，所以别只吃一种。而绿叶菜水分占九成，纤维稀得很，靠它凑够 25g 得吃几斤，不现实。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 16, "title": "酸奶要不要吃？", "sec": "饮食", "总结性建议": "每天可以多吃一些酸奶，但<strong>只吃无糖的，有糖的不要</strong>。300–500g 一天。", "具体地": "<p>觉得外面卖的无糖酸奶贵，就<strong>买大包装的酸奶当引子，再买菌粉自己做</strong>——成本能省很多，一次做一大罐，吃几天。买现成的看配料表，<strong>配料表里只有「生牛乳 + 菌种」的才对</strong>，凡是列了白砂糖、果葡糖浆、果酱的都不算。</p>", "为什么这样建议": "酸奶给你的是蛋白质、益生菌和饱腹感，这三样都是有糖酸奶给不了的——<strong>加了糖，你等于在喝一份甜点</strong>，糖带来的热量会把好处抵掉。自己做这件事的价值也很直接：无糖酸奶贵是因为「无糖」这两个字，不是因为工艺，自己发酵就没有这个溢价。", "主观证据等级": "B", "来源": "〔待你补〕  ---  &gt; <strong>下一节：5. 补剂</strong> —— 只买这五个，别的都别买 —— 只买这五个，别的都别买 —— 只买这五个，别的都别买", "level": "B", "src_done": false}]}, {"no": 5, "name": "补剂", "intro": "<p>这一节很短，因为答案是：你只需要五个。</p><p>先说一件事——这份名单里没有一个是智商税。市面上新手最常被推销的是 BCAA、氮泵、睾酮素、左旋肉碱、CLA，这五个一个都不在里面。</p><p>顺序上，补剂永远排在最后：先把吃够、睡够、练对做完，再来看这五个。</p>", "items": [{"no": 1, "title": "补剂该买哪些？", "sec": "补剂", "总结性建议": "值得买的就五个——肌酸（一水）、咖啡因、甘氨酸镁、维生素 D、鱼油。如果只能买一个，买肌酸。", "具体地": "<p>把预算全部压在这五个里（蛋白粉不算补剂，见下一条）。别买：BCAA（吃够蛋白它就没意义）、氮泵（本质是咖啡因加香精，贵十倍）、睾酮素（口服的没用，有用的买不到）、左旋肉碱和 CLA（证据太弱）。</p>", "为什么这样建议": "这五个恰好是证据相对最站得住的那五个。而被推销得最凶的那些，恰恰一个都不在这份名单里。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 2, "title": "蛋白粉有必要买吗？", "sec": "补剂", "总结性建议": "蛋白粉没必要，除非你的蛋白质吃不够。<strong>每天能从肉蛋奶里吃够，就完全不用买它。</strong>", "具体地": "<p>先按 04 节第 5 条那张配比表算一下你每天该吃多少蛋白（体重 × 2，70kg 就是 140g），再用「记食本」（我自己开发的那个，见前言）记几天，看你实际吃到多少。<strong>缺口大的时候，蛋白粉是最方便的一种补法</strong>——不用做菜、不用等、冲一杯就是 20–25g。</p>", "为什么这样建议": "它不算补剂，它是食物的替代品，只是把「吃肉」这件事拆成了「喝一杯」。所以判断标准很简单：能不能靠吃饭吃够。吃够就没必要，吃不够它就是最省事的那个选择。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 3, "title": "肌酸：该买哪种？", "sec": "补剂", "总结性建议": "买最便宜的「一水肌酸」就对了。这是整份名单里性价比最高的一项。", "具体地": "<p>每天 3–5g，什么时候吃都行，不用掐时机，也不用做「冲击期」。吃两三周后体重涨 1–2 kg 是正常的，那是肌酸把水带进了肌肉，不是胖，别慌着停。</p>", "为什么这样建议": "所有花哨的形态（盐酸肌酸、乙酯肌酸、液体肌酸、胶囊）贵好几倍，但没证明比一水更好。粉最便宜，一样用。", "主观证据等级": "A", "来源": "〔待你补〕", "level": "A", "src_done": false}, {"no": 4, "title": "咖啡因：每天吃多少？", "sec": "补剂", "总结性建议": "咖啡因有效，但它的第一个作用是偷你的睡眠。新手先从每天 100mg 开始。", "具体地": "<p>每天总量控制在 100mg 起（含咖啡、茶、可乐、能量饮料里的一切咖啡因）。一杯美式差不多就是 80–100mg。下午 3 点后不要再摄入。适应两三周、睡眠没受影响，再按体重往上调（3 mg/kg 起，70kg 约 200mg）。</p>", "为什么这样建议": "入睡变慢、半夜醒、早上起不来，任何一条出现，先把咖啡因降到 100mg 或者停掉。用咖啡因换来的那点训练表现，补不回你损失的睡眠。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 5, "title": "甘氨酸镁：吃哪种，什么时候吃？", "sec": "补剂", "总结性建议": "选甘氨酸镁，睡前 30–60 分钟吃。这是五个里唯一主要为了睡、而不是为了练的。", "具体地": "<p>睡前元素镁 200–400mg。吃了之后白天犯困，就往睡前挪一点，或者减量。</p>", "为什么这样建议": "别买「氧化镁」或者笼统的「镁片」图便宜，那类吸收差，主要作用是通便，不是补镁。选错形态等于没吃。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 6, "title": "维生素 D：直接补，还是先查血？", "sec": "补剂", "总结性建议": "维生素 D 是这五个里唯一一个「先验再买」的。缺不缺，抽个血就知道。", "具体地": "<p>先去内分泌科查一次「25-羟基维生素 D」（怎么查、为什么查，见 07 节）。查出来低，按医生给的剂量补；正常就不用长期吃。补了三到六个月复查一次，看有没有上来。</p>", "为什么这样建议": "这是全书最该有的那个态度——不猜，去验。而且它一次关联两件事：耳石症的复发风险，以及训练中骨折的风险，两件都在 07 节。", "主观证据等级": "A", "来源": "〔待你补〕", "level": "A", "src_done": false}, {"no": 7, "title": "鱼油：怎么挑？", "sec": "补剂", "总结性建议": "鱼油的关键不是「多少毫克鱼油」，是里面 EPA 加 DHA 一共多少克。", "具体地": "<p>每天 EPA + DHA 合计 1–2g。买的时候直接翻到成分表，找这两个词，加一下。</p>", "为什么这样建议": "瓶子上的大数字通常不是有效成分——标「鱼油 1000mg」的那瓶，可能只有 300mg 是 EPA 加 DHA。另外这一项见效最慢，别因为「没感觉」就不吃，也别指望它有感觉。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 8, "title": "补剂有多重要？", "sec": "补剂", "总结性建议": "顺序是吃够、睡够、练对，然后才是补剂。上面一层没做，下面这一层的钱全打水漂。", "具体地": "<p>先回 04 节确认吃够了（四条判据都成立），再回 06 节确认睡眠，再回 03 节确认训练。三样都过关，再来买这五个。</p>", "为什么这样建议": "补剂的作用有多大，取决于它下面那三层垫得有多实。而「反正便宜，先买了吃着」这句话，是所有智商税的开头。", "主观证据等级": "A", "来源": "〔待你补〕  ---  &gt; <strong>下一节：6. 恢复</strong> —— 睡眠 / 什么时候不练", "level": "A", "src_done": false}]}, {"no": 6, "name": "恢复", "intro": "<p>这一节讲两件事：怎么睡，和什么时候不练。</p><p>新手最容易忽略恢复，因为它不像训练那样有「我在努力」的感觉。但恢复才是把训练变成肌肉的那道工序——练只是下订单，恢复才是生产。</p>", "items": [{"no": 1, "title": "睡不好，训练是不是白练？", "sec": "恢复", "总结性建议": "睡不好，训练白练。睡眠时长排在训练时长前面。", "具体地": "<p>把它当成训练的一部分排进计划，而不是「剩下的时间」。连着三天睡不满 7 小时，那一周就别加重量了，先把觉补回来。</p>", "为什么这样建议": "肌肉和精力都是在睡眠里修复的。练是花钱，睡是挣钱，你只花不挣，账户迟早空。而「少睡多练」是从恢复里借高利贷。", "主观证据等级": "A", "来源": "〔待你补〕", "level": "A", "src_done": false}, {"no": 2, "title": "几点睡？", "sec": "恢复", "总结性建议": "不给「早睡」这种模糊的词，给一个时间点：11 点前上床。", "具体地": "<p>想 11 点睡着，10 点半就该上床。把手机充电器挪到客厅，是最有效的一招。连续一周做不到 11 点，先看晚上那段时间是不是被某件固定的事占掉了，改那件事，别怪意志力。</p>", "为什么这样建议": "有具体时间点，才能判断今天做没做到。而「练得晚」是排计划的问题，不是睡觉可以推迟的理由。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 3, "title": "睡前能不能看手机？", "sec": "恢复", "总结性建议": "睡前半小时把手机放到手够不着的地方。原因是手机让你晚睡，不是因为蓝光。", "具体地": "<p>这半小时拿来洗澡、拉伸、看书，或者什么都不做。放了手机还是睡不着，问题就不在手机，在白天的咖啡因（见 05 节）。</p>", "为什么这样建议": "真正的问题不是屏幕伤眼睛，是它让你一直不睡。所以这条要么做到，要么没做，中间没有「少看点」这一档。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 4, "title": "睡前做什么能睡得更好？", "sec": "恢复", "总结性建议": "睡前把体温升上去、再让它降下来，是最好用的入睡开关。", "具体地": "<p>睡前 1 小时左右做，水温偏热，10–15 分钟。泡脚最省事，不用整身洗，一盆热水就够。太晚做反而更精神的话，往前挪到睡前 1.5 小时。</p>", "为什么这样建议": "洗澡、泡澡、泡脚是同一件事——升高体温，然后体温回落，人就困了。刚泡完浑身发热那一下是兴奋的，等它落下来再睡。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 5, "title": "没睡好，还练不练？", "sec": "恢复", "总结性建议": "没睡够的日子不是不能练，是不能照原计划练。这天练的意义是不断链，不是出成果。", "具体地": "<p>重量降到平时的 80–90%，组数减一组，做完就算成功。不加重量，不试新动作。连着两晚没睡好，直接改成只有有氧或者休息。</p>", "为什么这样建议": "睡不够的时候动作控制会下降，风险不变、产出下降。而且欠的是觉不是训练量，第二天硬要补回来，补错了东西！", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 6, "title": "什么时候不练？", "sec": "恢复", "总结性建议": "三种情况不练——疲惫、状态不佳、肌肉关节疼痛。", "具体地": "<p>进馆前先问自己三句话：今天累不累？状态行不行？身上有没有哪个地方疼？有一个「是」，今天就不做正式的重量训练（可以走一走、拉伸，或者干脆休息）。</p>", "为什么这样建议": "这不是偷懒，是把恢复当成训练的一部分。训练计划是给正常状态定的，不是给所有状态定的。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 7, "title": "心情不好，还去不去？", "sec": "恢复", "总结性建议": "情绪不构成停练理由。疲惫、疼痛要停，心情不好不用停——恰恰相反，那天更该去。", "具体地": "<p>把第 6 条那三句话和情绪分开判断。累？疼？状态差？都不的话，心情再糟也去，哪怕只练 20 分钟。</p>", "为什么这样建议": "一旦允许情绪接管计划，它就变成最好用的一条请假理由，可以无限次使用。「今天心情不太好」这句话太好用了，所以最危险！", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 8, "title": "酸痛和疼痛，怎么分？", "sec": "恢复", "总结性建议": "练后第二天的酸痛是正常的，照练；疼痛不是酸痛。判据是钝还是尖，不是「有多疼」。", "具体地": "<table><thead><tr><th></th><th><strong>酸痛</strong>（正常）</th><th><strong>疼痛</strong>（损伤信号）</th></tr></thead><tbody><tr><td>感觉</td><td>钝、弥散，按上去整块都疼</td><td>尖锐、定点，某个角度才疼</td></tr><tr><td>出现</td><td>练后 12–48 小时</td><td>当场，或第二天醒来就有</td></tr><tr><td>位置</td><td>整块肌肉</td><td>一个点、一条线、或关节缝里</td></tr><tr><td>怎么办</td><td>照练，练开了会舒服</td><td>停下引起它的动作</td></tr></tbody></table><p>练前按一下昨天练过的地方——整块酸就练，某个点一按就疼就换动作。</p>", "为什么这样建议": "痛觉的性质比程度更能区分损伤和适应。用「练开了就不疼了」去判断一个尖锐疼痛，是最常见的小伤拖成大伤的方式——那句话只对酸痛成立。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 9, "title": "同一块肌肉隔多久练一次？", "sec": "恢复", "总结性建议": "同一块肌肉需要至少隔一天。今天练背，明天就练腿或者胸。", "具体地": "<p>排一周的时候，把相近部位隔开至少 48 小时。这也是上下肢二分化、推拉蹲这类循环好用的原因，它们天然就把相近部位隔开了。</p>", "为什么这样建议": "肌肉是在恢复的时候才长的，连续两天练同一块，第二天练的是消耗不是刺激。某块肌肉连续几天都酸，回去看循环是不是排重复了。", "主观证据等级": "A", "来源": "〔待你补〕  ---  &gt; <strong>下一节：7. 身体不适与安全</strong> —— 先查维 D / 耳石症个案", "level": "A", "src_done": false}]}, {"no": 7, "name": "身体不适与安全", "intro": "<p>这一节是全书唯一一节「先查、再练」的地方。</p><p>前面六节都建立在你是个能正常训练的人这个前提上。这一节处理的是：如果这个前提不成立呢？</p><p>先花一次抽血的钱，把不确定的那部分问清楚，比买任何补剂都值。</p>", "items": [{"no": 1, "title": "练之前要不要先查维生素 D？", "sec": "身体不适与安全", "总结性建议": "这是全书唯一一条「先查再练」的前置动作。尤其是久坐办公的人——负重刺激少，是低骨密度的高风险人群。", "具体地": "<p>去内分泌科，抽血查 25-羟基维生素 D。就这一项，一次抽血。查出来低就按医生给的剂量补（见 05 节），三到六个月复查一次；正常就不用长期吃。</p>", "为什么这样建议": "别靠「我晒了太阳应该不缺」来判断。这件事不用猜，抽个血就知道——这本来就是这本书该有的样子。", "主观证据等级": "A", "来源": "〔待你补〕", "level": "A", "src_done": false}, {"no": 2, "title": "维生素 D 低了会怎样？", "sec": "身体不适与安全", "总结性建议": "维 D 低会同时影响两个方向——骨密度，和耳石症的复发风险。", "具体地": "<p>把这条和 05 节的补剂条、下面第 4 条的耳石症条当成一件事看：</p><blockquote>查一次维 D → 低了就补 → 既防耳石症复发，也防训练中骨折。</blockquote><p>复查之后没上来，剂量交给医生调，别自己加。</p>", "为什么这样建议": "训练是给骨头加负荷的事，骨头脆的时候加负荷，就是骨裂和骨折的时机。这是唯一一条「先别练」的红线。", "主观证据等级": "A", "来源": "〔待你补〕", "level": "A", "src_done": false}, {"no": 3, "title": "训练要不要憋气？", "sec": "身体不适与安全", "总结性建议": "过度憋气要停。发力时呼气、还原时吸气，这是默认做法。", "具体地": "<p>大重量、要稳定核心的那一两下可以短憋，但憋完立刻呼气，不要连续多组憋。任何时候出现头晕、眼前发黑、耳鸣，立刻停下、把重量放下，不要「再试一组看看」。</p>", "为什么这样建议": "憋气会升高胸腔和颅内的压力，可能带来头晕、眼前发黑、血压骤变；对已经有耳石症的人，还可能直接诱发眩晕。它证明的不是核心力量，是你把血压顶上去了。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 4, "title": "我的耳石症是怎么来的？", "sec": "身体不适与安全", "总结性建议": "我的情况是两件事叠在一起——一个是医学上已知的相关因素（维 D 低），一个是我自己的推测（憋气）。两半的可信度不一样，我分开说。", "具体地": "<p>我经历了两次，前后隔一个月——</p><ul><li data-i=\"1\"><strong>6 月</strong>：练胸时一直憋气，没掌握好呼吸节奏，加上维 D 水平低，触发第一次耳石症。</li><li data-i=\"1\"><strong>7 月初</strong>：休息一个月后重新开始练推胸，<strong>又憋气了</strong>，第二次触发。</li><li data-i=\"1\"><strong>这一次我才去查了维生素 D</strong>，发现 25-羟基维生素 D 水平特别低。又休息一个月加上补维 D，8 月才逐渐恢复训练。</li></ul><p>两半的可信度不一样，分开说：</p><ul><li data-i=\"1\"><strong>维生素 D 偏低</strong>：这块有共识——BPPV（耳石症）与血清 25-羟基维生素 D 偏低相关，补维 D 能降低复发。这条可以直接照做。</li><li data-i=\"1\"><strong>训练时习惯憋气</strong>：我怀疑跟它有关，因为憋气会升高颅内压。但「憋气导致耳石症」不是我查到的医学共识，只是我自己的判断，可以参考，别当结论。</li></ul><p>如果你也在练憋气、也开始头晕，先去医院，再回来看这一节。</p>", "为什么这样建议": "主张可以是我的，事实不能。把这两半分开标，比笼统说「憋气导致耳石症」更诚实，也更有用——你至少能拿走能拿走的那一半。", "主观证据等级": "C", "来源": "〔待你补〕", "level": "C", "src_done": false}, {"no": 5, "title": "确诊耳石症之后，还能练吗？", "sec": "身体不适与安全", "总结性建议": "耳石症之后我没停练，但把训练整体换了个方向——避开所有需要憋气的推类动作，把重心移到背、二头和后束。腿每周练 1 次。", "具体地": "<ul><li data-i=\"0\">避开：卧推、站姿推举这类一憋气就把压力顶上去的推类动作；任何会让你头晕的体位变化（快速低头、仰头、翻身类动作）</li><li data-i=\"1\">替代：固定器械（轨迹固定、能正常呼吸完成）、坐姿类动作，以及背、二头、后束为主</li><li data-i=\"1\">保留：腿，每周只排 1 次</li><li data-i=\"1\">呼吸：每一组都按「发力呼气」走，不憋</li><li data-i=\"1\">任何一次训练出现眩晕，立刻停，别硬撑完这一组</li></ul>", "为什么这样建议": "两次之后我查遍了资料，找不到「耳石症患者的训练方案」，网上全是休息和复位。第二次之后我停了一个月，8 月才慢慢接上，然后把方向整个换掉——从那以后训练走上了正轨，也没再复发！", "主观证据等级": "C", "来源": "〔待你补〕", "level": "C", "src_done": false}, {"no": 6, "title": "关节不舒服，要不要停？", "sec": "身体不适与安全", "总结性建议": "不适的意义不是「要不要忍」，是身体在给你一个可以免费排查的报警。", "具体地": "<p>出现不适按三步走——① 停掉引起它的那个动作，其他部位照常练（不用整个停）② 按第 7 条把问题描述清楚 ③ 该去医院就去。不适持续超过一周，或者有尖锐痛、麻、关节响痛、肿胀，直接去医院，别在网上自我诊断。</p>", "为什么这样建议": "一周是一个分水岭。一周以内的多半能自己过去，超过一周的基本不会自己好。忽略它的代价，是后来花更多时间停练。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 7, "title": "怎么把不适说清楚？", "sec": "身体不适与安全", "总结性建议": "「哪里疼」说不清，是因为你在用日常语言描述一个解剖学位置。换一套说法，答案的质量立刻不一样。", "具体地": "<p>描述四件事——① 位置：具体到哪块肌肉或哪个关节（「肩胛骨内侧缘、肩胛下角以上」，不是「后背疼」）② 动作：做什么动作时疼（「手臂抬到耳朵高度时」）③ 性质：钝、尖锐、麻、酸胀、卡顿 ④ 时间：当场就疼还是第二天才疼，持续多久。</p>", "为什么这样建议": "拿「疼得厉害」当主要信息，任何人都给不出有用的回答，包括医生。疼的程度最没用，在哪、什么时候、什么性质才有用。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 8, "title": "怎么用 AI 查出自己哪里不对？", "sec": "身体不适与安全", "总结性建议": "02 节那个解剖软件，在这里才是真正的用处。它让你能准确说出「是哪一块」和「是哪一条路的」。", "具体地": "<p>三步——① 打开解剖软件，按第 7 条的「位置加动作」找到具体是哪块肌肉、哪个关节 ② 向 AI 描述症状：把第 7 条那四件事说全，并且说清是哪块肌肉或关节（「肩胛骨内侧、菱形肌区域，手臂前伸时尖锐痛」）③ 让 AI 给出可能的原因、该停哪些动作、哪些关联肌肉需要强化。</p>", "为什么这样建议": "它的用处是帮你把问题描述清楚、缩小范围，不是下诊断。凡是涉及「要不要就医」「要不要吃药」，一律以医生的为准——别把 AI 当医生。", "主观证据等级": "B", "来源": "〔待你补〕  ---  &gt; <strong>下一节：8. 花钱与避坑</strong> —— 月卡 / 教练 / 训记", "level": "B", "src_done": false}]}, {"no": 8, "name": "花钱与避坑", "intro": "<p>这一节只回答一件事：哪些钱该花，哪些钱是在买心理安慰。</p><p>原则先摆出来：花在「能让你练下去」上的钱值得花；花在「让你觉得自己很努力」上的钱不值得。前者是月卡和几节课，后者是年卡、装备和补剂大礼包。</p>", "items": [{"no": 1, "title": "在家练，还是去健身房？", "sec": "花钱与避坑", "总结性建议": "对于新手，更推荐去健身房。在家练最大的问题是容易因为惰性放弃。", "具体地": "<p>两条理由——① <strong>氛围</strong>：健身房有大家一起运动的氛围，初期更容易坚持下来；而且你还能观察别人是怎么训练的，这对自己的训练也有帮助 ② <strong>器械</strong>：健身房器械多，能让你练得更全面。</p>", "为什么这样建议": "<strong>习惯的养成就是一个固定神经连接的过程。</strong> 刚开始需要消耗很大的意志力，所以很难坚持；等这个连接固定下来，意志力的消耗就降下来了，后面的坚持是自然而然发生的，不再需要消耗多少意志力。而家里没有这个环境——你每天都要多消耗一次「今天要不要练」的决策成本，而那一次就足以让你放弃。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 2, "title": "健身房怎么选？", "sec": "花钱与避坑", "总结性建议": "没必要选特别贵的。新手前期只要能让自己有效地运动、训练起来，这就比较重要。", "具体地": "<p>① <strong>别选特别贵的</strong>——按自己的财力来，新手从性价比的角度考虑 ② <strong>最重要的是方便</strong>：离家近、离工作地点近、<strong>停车方便</strong> ③ <strong>所有流程都要最简化</strong>。</p>", "为什么这样建议": "新手对肌肉的目的感和发力感都比较差，<strong>感觉不出来器械的好坏</strong>，那些贵出来的部分你根本用不上。等你有了基础、能感受并评价出「这家器械不够好、不够顺滑」之后，再去挑和换。而到那个时候你会发现，真正让你练不下去的从来不是器械，是距离——<strong>要降低任何可能阻碍自己去健身房的因素</strong>，这比什么都重要。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 3, "title": "办月卡还是年卡？", "sec": "花钱与避坑", "总结性建议": "你还没证明自己能坚持，就先别买「坚持」。月卡贵一点，但它是你的试错成本。", "具体地": "<p>先办一个月。一个月能去满 8 次，再续一个月；连续三个月都去满，那时候再考虑半年卡或年卡。一个月去不到 4 次，问题不在卡，在你还没开始——回 01 节。</p>", "为什么这样建议": "年卡便宜，是把还没发生的坚持提前付了钱。而「平均每天只要几块钱」这个话术，是把总额除以 365 天的算法，跟你能不能去没有任何关系。", "主观证据等级": "A", "来源": "〔待你补〕", "level": "A", "src_done": false}, {"no": 4, "title": "开始练要买什么装备？", "sec": "花钱与避坑", "总结性建议": "装备是奖励，不是启动条件。新手前三个月需要的东西只有一样：一双平底、鞋底不太厚的运动鞋。", "具体地": "<p>按顺序解锁——第一周一双运动鞋；第一个月还在练，加一副手套；重量明显上去了、硬拉握不住，再考虑助力带和腰带（腰带要先学会呼吸再用）。每次想买装备先问一句：它会让我多去一次吗？</p>", "为什么这样建议": "装备齐了、人没去过几次，是新手最常见的开局。塑形腰带、暴汗服这类东西的作用是让你出汗，不是让你变强。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 5, "title": "器械要不要消毒，用什么消毒？", "sec": "花钱与避坑", "总结性建议": "去健身房一定要做好消毒，而且要用对东西。我用的是次氯酸。", "具体地": "<p>① 买<strong>次氯酸片自己兑</strong>，比买瓶装的便宜很多 ② <strong>自己带一条毛巾</strong>，用来擦器械，也用来擦手，<strong>定时清洗</strong> ③ 用之前把握把、座椅、靠背擦一遍，练完擦手。</p>", "为什么这样建议": "健身房里常见的是<strong>真菌感染</strong>（脚气、体癣这类），而不只是细菌。酒精也能杀真菌，但它挥发太快、没有残留作用，擦完等你上手的时候已经干了。次氯酸广谱、起效快、对皮肤刺激也小，在健身房这个场景更合适，所以我用次氯酸而不是酒精。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 6, "title": "进馆的包里该带什么？", "sec": "花钱与避坑", "总结性建议": "包里的东西不多，就三样；鞋子比衣服重要，要选偏硬底的。", "具体地": "<ul><li data-i=\"0\"><strong>包里</strong>：① 小瓶次氯酸喷雾（擦器械用）② 擦次氯酸的毛巾 ③ 大瓶的水。<strong>健身过程中要时常小口补水</strong>，别等到渴了才喝。</li><li data-i=\"1\"><strong>鞋子</strong>：穿<strong>偏硬底</strong>的，鞋底软的跑鞋反而不合适。不管你练背还是练腿、上肢还是下肢，都需要脚有稳定的支撑。<strong>哪怕做高位下拉，你也得顶住下肢把自己稳住</strong>，对踩实地面是有要求的。</li></ul>", "为什么这样建议": "软底鞋把地面给你的反作用力吃掉一部分，发力就会发虚，尤其在深蹲、硬拉这类要往地上蹬的动作里。而水这一项——它在训练中比在训练后有用，小口补比一次灌好。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 7, "title": "要不要戴手套？", "sec": "花钱与避坑", "总结性建议": "在保证消毒的前提下，<strong>新手不戴手套可能是更好的选择</strong>——更能练到手部肌肉和抓握力。", "具体地": "<p>不用一开始就买。如果手掌磨得难受，再加一副薄手套。不戴的话，把消毒和洗手做足（见第 5 条）。</p>", "为什么这样建议": "握力是训练里很实在的一项能力，03 节第 14 条讲引体向上时就说过——背阔肌、握力、肩胛稳定三样缺一样都上不去。手套把手掌和握力这一部分训练拿走了，练到后面你会发现握力先到瓶颈，然后卡住你的就是引体向上和所有拉的重量。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 8, "title": "私教要买多少节？", "sec": "花钱与避坑", "总结性建议": "教练的作用在前几节课最密集——熟悉器械、纠正错误动作。后面大部分课，你在为「陪伴」付钱。", "具体地": "<p>先买最小的一档（通常 5–10 节）。用这几节把器械过一遍、把动作纠正到位，然后按 03 节第 15、16 条测试自己能不能独立走一周。能独立排一次训练、能自己判断动作对错，就停课。</p>", "为什么这样建议": "别签「分期」「包年」的大课包，一旦签了，你就从学员变成了人质。而「还没有练好」这个理由可以无限续下去，因为练好没有终点。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 9, "title": "怎么分辨教练适不适合自己？", "sec": "花钱与避坑", "总结性建议": "两条——<strong>先看他练得好不好，再看上课的时候他给的干货多不多。</strong>", "具体地": "<p>① <strong>看他自己的水平</strong>：他自己练得不好，绝对不要选 ② <strong>上课时看四点</strong>：教的要点清楚不清楚、废话多不多、干货多不多、相处下来舒不舒服。</p>", "为什么这样建议": "一个动作他自己做不出来，就没法判断你的问题在哪，只能照着教案念。而「相处舒不舒服」不是客套话——你要跟这个人练好几个月，不舒服你就会开始找理由不去，最后钱白花。这两条里，<strong>第一条是门槛，第二条是筛子</strong>。", "主观证据等级": "B", "来源": "〔待你补〕", "level": "B", "src_done": false}, {"no": 10, "title": "训练要不要记录？", "sec": "花钱与避坑", "总结性建议": "不记，你就无法知道自己在不在进步。", "具体地": "<p>用「训记」记每一组——动作、重量、次数，加上训练当下的状态（睡得好不好、状态行不行）。记完先不用分析，记满两个月。</p>", "为什么这样建议": "03 节里所有「什么时候加重」「什么时候该改」的判断，全部建立在有记录这个前提上。两个月后回头看，你会第一次看见「进步」长什么样。另外，打卡是给别人看的，记录是给自己用的。", "主观证据等级": "A", "来源": "〔待你补〕", "level": "A", "src_done": false}, {"no": 11, "title": "钱该花在哪？", "sec": "花钱与避坑", "总结性建议": "花钱有顺序。顺序反了，等于把钱花在了用不上的地方。", "具体地": "<table><thead><tr><th>顺序</th><th>花在哪</th><th>为什么</th></tr></thead><tbody><tr><td>1</td><td>月卡（先买一个月）</td><td>决定你练不练</td></tr><tr><td>2</td><td>5–10 节私教课</td><td>决定你练得对不对</td></tr><tr><td>3</td><td>一双鞋 + 训记（免费）</td><td>决定你能不能开始、能不能看见进步</td></tr><tr><td>4</td><td>肌酸等补剂（见 05 节）</td><td>决定你还能再好多少</td></tr><tr><td>5</td><td>装备、腰带、护具</td><td>前四样到位了再说</td></tr></tbody></table><p>每花一笔钱之前，先对一下这张表，看你跳过前面某项了没有。</p>", "为什么这样建议": "新手最常见的，就是从第 5 行开始买。倒着花钱的结果是装备齐全、月卡没办，然后练不下去。", "主观证据等级": "B", "来源": "〔待你补〕   ---  &gt; <strong>本节完。全书 8 节成稿。</strong>", "level": "B", "src_done": false}]}], PAGES={"pre": {"html": "<h1>前言 · 我练的第一年</h1><p>去年 10 月 19 号，我第一次进健身房。</p><p>头两个月找了教练带我上课，这段时间基本上是在学怎么用器械，同时也在发现自己的问题。</p><p>第一个问题是肩。我发现自己左侧肩袖关节活动度很差，而这跟之前自己瞎练导致的肩峰撞击有关。后果是后面肩膀一直没法好好训练，推肩这些都不行，会弹响、会痛。<strong>这个肩痛困扰了我大概 10 年。</strong> 教练并没有帮我改善它，后来是我自己一点点加强肩袖肌群，才慢慢恢复过来的。</p><p>两个月之后我开始自主训练，没有再找教练。</p><p>3 月的一次热身，我用泡沫轴滚压肋骨，没有正确地滚到胸大肌，把胸部肋骨滚到骨裂，停训了一个月。</p><p>6 月练胸的时候一直憋气，没有掌握好呼吸节奏，再加上自己维生素 D 水平低，触发了第一次耳石症。恢复一个月后，7 月初重新开始练推胸，又憋气了，第二次触发耳石症。这一次我去查了维生素 D，发现 25-羟基维生素 D 水平特别低。</p><p>又休息了一个月，加上补维生素 D，8 月我才逐渐恢复训练。也是从下半年开始，训练走上了正轨，逐渐找到了健身的感觉，同时开始记录饮食。</p><h4>为了记录饮食，我做了个 App</h4><p>为了记录饮食，我自己开发了一款叫「记食本」的 App。</p><p>在那之前我只是凭感觉在吃——觉得吃够了，其实吃不够。体重一直卡在瓶颈上，因为有时候暴饮暴食，有时候又节食，饮食一直不太稳定，偶尔还吃外卖，吃得不干净，所以很容易卡平台。</p><p>开始严格记录饮食之后，我明显感觉到精力恢复得更好，也能很清楚地看到自己的问题在哪。</p><p>举一个例子。有一段时间我晚上睡眠质量很差，早上四五点钟就醒。跟豆包聊过之后，我判断可能是平时热量摄入太低、碳水吃得不够，加上训练强度大，热量缺口太大，皮质醇升高，所以会早醒。有了这个判断作支撑，我把每天的热量和碳水都调高了——效果很明显，一两天之后，睡眠质量就得到了显著改善。</p><p><strong>这就是记录的用处：它把「我感觉不太对」变成了一个可以调的数字。</strong></p><h4>现在</h4><p>练了将近一年，我从一个基本上没什么肌肉的小白，已经能做到 <strong>47kg 的高位下拉</strong>，练出了一点训练痕迹，也改善了自己的肱骨前移和肩峰撞击。我觉得还是挺满意的。希望能继续一步一个脚印地坚持下去。</p><h4>为什么写这本指南</h4><p>健身一年来踩过了不少坑，也经历了一些伤痛，就想就此记录下来，跟大家分享一下这一年学到的一些东西。</p><p><strong>健身一年，正是因为是小白，对近一年踩过的坑才记忆深刻。</strong> 那些在别人眼里「这有什么难的」的地方，恰恰是我卡得最久的地方——这种细节，练了很多年的人早就想不起来了。所以这本指南不是从上面往下教的，是从旁边递过去的：我摔过的那些跤，你就不用再摔一遍。</p><p>健身相关的知识纷繁复杂、鱼目混珠。所以有一件事想先说在前面：<strong>一定要学会带着质疑的眼光去看待各种知识，不要求全，要本着实事求是的精神去健身。</strong></p><p><strong>实践也是检验真理的唯一标准</strong>，一定要亲身去实践。</p><p>当然，本指南也只是我个人的经验，是我自己总结出来供大家参考的内容。<strong>具体真假、可信程度，还请大家自行甄别。</strong></p><blockquote>后面的 8 节，都是从这一年里长出来的。</blockquote>"}, "end": {"html": "<h1>结语</h1><p>写到这里，八节都交代完了。</p><p>如果你只记住一件事，我希望是 01 节第 12 条说的那件事：<strong>健身是修炼，也是修心。</strong></p><p>前面那几十条全是方法和数字——热身几分钟、每组做几次、蛋白吃多少克、月卡还是年卡。它们都有用，但加起来也只是手段。真正的收获不在体重秤上，也不在重量记录里，而在有一天你发现：遇事不那么烦了，睡觉和吃饭变规律了，别人说的话没那么容易进到心里去。<strong>那一刻才算真的从这件事里拿到了东西！</strong></p><p>所以别把这些当成任务清单。它是一份按顺序排好的备选单——挑走一两条就算数，剩下的放到需要的时候再回来查。<strong>我自己也没做到其中大部分。</strong></p><p>最后四句：</p><ul><li data-i=\"0\"><strong>断了就断了。忘掉过去，继续练下去就行。</strong> 这一条比其余所有条加起来都重要。</li><li data-i=\"0\"><strong>别等准备好了再开始。</strong> 一双鞋、一个月的卡，就可以开始了。</li><li data-i=\"0\"><strong>睡得够比练得多值钱。</strong> 练是花钱，睡是挣钱，只花不挣的账迟早会空。</li><li data-i=\"0\"><strong>练久了你会发现，你练的不是身体，是那个能一直练下去的自己。</strong></li></ul><p>去练吧。</p><blockquote>想更系统地学，见 [附录 · 参考书目](附录-参考书目.md)。</blockquote>"}, "app": {"html": "<h1>附录 · 参考书目</h1><h4>先说清楚</h4><p><strong>这本书完全是我个人的经验和建议，不构成任何权威的建议。</strong></p><p>书里的「主观证据等级」全部是我自己标的，仅供参考。你要拿去用之前，请回头看一下每条的具体内容，别只看等级。</p><h4>想系统学过训练</h4><table><thead><tr><th>书</th><th>适合谁</th></tr></thead><tbody><tr><td><strong>《肌肉与力量全书》</strong></td><td>想搞懂训练量、频率、强度这些变量之间关系的人</td></tr><tr><td><strong>《力量训练解剖全书》</strong></td><td>想看清每个动作到底在练哪块肌肉的人</td></tr></tbody></table><h4>想解决自己的疼痛</h4><table><thead><tr><th>书</th><th>适合谁</th></tr></thead><tbody><tr><td><strong>《肌肉链和扳机点》</strong></td><td>按压某个点会牵出一片疼的人</td></tr><tr><td><strong>《解剖列车》</strong></td><td>想知道「为什么脚的问题会传到腰」的人</td></tr></tbody></table><blockquote>这两本是讲肌肉链条和扳机点的，方向偏「找源头」。但<strong>疼痛如果持续超过一周、或者有麻和尖锐痛，先去医院</strong>，别只靠看书（见 07 节第 6 条）。</blockquote><h4>想系统学营养</h4><table><thead><tr><th>书</th><th>适合谁</th></tr></thead><tbody><tr><td><strong>《中国居民膳食营养素参考摄入量》</strong></td><td>想要权威数字、拿去核对的人（工具书，不用通读）</td></tr><tr><td><strong>《健身营养全书》</strong></td><td>想搞懂碳水、蛋白、脂肪怎么安排的人</td></tr></tbody></table><h4>我自己的使用顺序</h4><p>如果你只打算看一本，从 <strong>《力量训练解剖全书》</strong> 开始——它直接对上 02 节「地基」那一节，看完你就知道自己在练什么了。</p>"}};

const $=s=>document.querySelector(s), nav=$("#nav");
const tabs=[{k:"pre",t:"前言"},...DATA.map(s=>({k:String(s.no),t:s.no+". "+s.name})),{k:"end",t:"结语"},{k:"app",t:"附录"}];
nav.innerHTML=tabs.map(t=>`<button data-k="${t.k}">${t.t}</button>`).join("");
nav.onclick=e=>{const b=e.target.closest("button");if(!b)return;cur=b.dataset.k;draw();
  window.scrollTo({top:0,behavior:"smooth"});};
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  lv[c.dataset.lv]=!lv[c.dataset.lv];c.classList.toggle("on");draw();});
$("#q").oninput=e=>{q=e.target.value.trim().toLowerCase();draw();};
const hay=it=>[it.title,it["总结性建议"],it["具体地"],it["为什么这样建议"]].join(" ").replace(/<[^>]+>/g,"").toLowerCase();
function card(it,showSec){
  return `<div class="card"><h3><span class="num">${it.no}</span>
    <span class="lv ${it.level}">${it.level}</span><span>${it.title}</span>
    ${showSec?`<span class="sec-tag">${it.sec}</span>`:""}</h3>
    ${["总结性建议","具体地","为什么这样建议","来源"].map(f=>{
      let v=it[f];
      if(f==="来源"&&!it.src_done) v=`<span class="todo">〔待补〕</span>`;
      return `<div class="f"><div class="k">${f}</div><div class="v">${v}</div></div>`;
    }).join("")}</div>`;
}
function draw(){
  nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.k===cur));
  const isList=!("pre end app".split(" ").includes(cur));
  $("#tools").style.display=isList?"flex":"none";
  if(!isList){$("#body").innerHTML=`<div class="page">${PAGES[cur].html}</div>`;return;}
  if(q){                                   /* 有搜索词 → 全书跨节搜 */
    const hits=[];
    DATA.forEach(s=>s.items.forEach(it=>{if(lv[it.level]&&hay(it).includes(q))hits.push(it)}));
    $("#cnt").textContent=`全书命中 ${hits.length} 条`;
    $("#body").innerHTML=hits.length
      ? hits.map(it=>card(it,true)).join("")
      : '<div class="card">没找到。换个词试试，或者清空搜索框。</div>';
    return;
  }
  const s=DATA.find(x=>String(x.no)===cur);   /* 无搜索词 → 只看当前节 */
  const items=s.items.filter(it=>lv[it.level]);
  $("#cnt").textContent=`${items.length} / ${s.items.length} 条`;
  $("#body").innerHTML=`<div class="intro">${s.intro}</div>`+items.map(it=>card(it,false)).join("");
}
draw();
</script></body></html>
